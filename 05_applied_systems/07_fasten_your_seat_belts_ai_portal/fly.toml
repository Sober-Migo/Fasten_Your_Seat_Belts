app = "change-me-seatbelts-portal"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "7860"
  SENTIMENT_MODEL = "distilbert/distilbert-base-uncased-finetuned-sst-2-english"

[http_service]
  internal_port = 7860
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "2gb"
